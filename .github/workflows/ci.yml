name: CI/CD - Build and Release

on:
  push:
    branches: [ main, master, develop, "ariel/**" ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Beta release tag (e.g. v1.2.0-beta.1); blank runs checks only'
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify production and simulator
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Setup Gradle properties for karoo-ext
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      run: |
        mkdir -p ~/.gradle
        echo "gpr.user=${GPR_USER:-${{ github.actor }}}" >> ~/.gradle/gradle.properties
        echo "gpr.key=${GPR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}" >> ~/.gradle/gradle.properties

    - name: Verify and build debug
      run: ./gradlew spotlessCheck :shared:testDebugUnitTest :simulator:testDebugUnitTest :shared:lintDebug :app:lintDebug :simulator:lintDebug :app:assembleDebug :simulator:assembleDebug --stacktrace

    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: verification-reports
        path: |
          shared/build/test-results/**/*.xml
          shared/build/reports/tests/
          simulator/build/test-results/**/*.xml
          simulator/build/reports/tests/
          shared/build/reports/lint-results*
          app/build/reports/lint-results*
          simulator/build/reports/lint-results*
        retention-days: 7

    - name: Upload Debug APK
      uses: actions/upload-artifact@v6
      with:
        name: wprime-debug-apk
        path: app/build/outputs/apk/debug/WPrimeExtension-*.apk
        retention-days: 30

  release:
    name: Publish Karoo release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    permissions:
      contents: write
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Setup Gradle properties for karoo-ext
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      run: |
        mkdir -p ~/.gradle
        echo "gpr.user=${GPR_USER:-${{ github.actor }}}" >> ~/.gradle/gradle.properties
        echo "gpr.key=${GPR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}" >> ~/.gradle/gradle.properties

    - name: Validate release tag
      env:
        RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        git check-ref-format "refs/tags/$RELEASE_TAG"
        tag_commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
        if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
          echo "Release tag must point to the verified workflow commit"
          exit 1
        fi
        if [[ "$IS_DISPATCH" == "true" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
          echo "Manual publication requires a beta tag such as v1.2.0-beta.1"
          exit 1
        fi

    - name: Build Karoo release APK
      run: ./gradlew :app:assembleRelease --stacktrace

    - name: Upload Release APK to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/WPrimeExtension-*.apk
          app/manifest.json
          assets/wprime-icon.png
        tag_name: ${{ inputs.tag || github.event.release.tag_name }}
        target_commitish: ${{ github.sha }}
        draft: false
        prerelease: ${{ github.event_name == 'workflow_dispatch' || github.event.release.prerelease }}
        make_latest: ${{ (github.event_name == 'workflow_dispatch' || github.event.release.prerelease) && 'false' || 'legacy' }}
        fail_on_unmatched_files: true
        # Preserve the locally verified APK and its signing identity when already attached.
        overwrite_files: false
        token: ${{ secrets.GITHUB_TOKEN }}

