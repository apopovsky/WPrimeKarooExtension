name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 1' # Weekly on Mondays

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    # Disabled pending verification of CodeQL support for the actual AGP/Kotlin compiler.
    # Required style, unit tests and Android lint run in ci.yml.
    if: false
    permissions:
      security-events: write
      actions: read
      packages: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
    - name: Setup Gradle properties for karoo-ext
      env:
        GPR_USER: ${{ secrets.GPR_USER }}
        GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
      run: |
        mkdir -p ~/.gradle
        echo "gpr.user=${GPR_USER:-${{ github.actor }}}" >> ~/.gradle/gradle.properties
        echo "gpr.key=${GPR_TOKEN:-${{ secrets.GITHUB_TOKEN }}}" >> ~/.gradle/gradle.properties
        
    - name: Build project
      run: ./gradlew assemble --stacktrace
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

